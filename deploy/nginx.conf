# D1 운영 nginx: 외부에 열리는 유일한 문. /etc/nginx/conf.d/default.conf 로 마운트한다(http 안에 들어가는 설정)
server_tokens off;

# 글자 기반 응답만 압축한다(이미지·xlsx 같은 이미 압축된 파일은 gzip_types 에 넣지 않는다)
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

# 터널(cloudflared)이 붙여 주는 실제 접속자 IP. 신뢰하는 출처는 터널 컨테이너 한 곳(compose 의 edge 망 고정 주소)뿐이다
set_real_ip_from 172.28.10.10;
real_ip_header CF-Connecting-IP;

# IP당 요청 제한. 업로드·세션 생성은 POST 만 센다(키가 빈 값이면 제한하지 않는다)
map $request_method $post_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $post_key zone=create:10m rate=6r/m;
limit_req_zone $post_key zone=preview:10m rate=6r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 5m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    error_page 413 = @too_big;
    error_page 429 = @too_many;
    location @too_big {
        default_type application/json;
        charset utf-8;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        return 413 '{"detail":"파일이 너무 큽니다. 최대 5MB까지 올릴 수 있습니다."}';
    }
    location @too_many {
        default_type application/json;
        charset utf-8;
        add_header Retry-After 10 always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        return 429 '{"detail":"요청이 너무 많습니다. 잠시 후 다시 시도해 주세요."}';
    }

    # ---- /api: 허용 목록(datasets·sessions·jobs·sample.csv·template.xlsx·bom/template·eval/runs) 밖은 403 ----
    location /api/ { return 403; }

    # 허용 목록 안이어도 막는 것: 세션 감사 경로, 정답 라벨이 걸린 개발·측정 평가 기록
    location ~ ^/api/sessions/[^/]+/audit(/|$) { return 403; }
    location ~ ^/api/eval/runs/.*gold-(dev|measure) { return 403; }

    # 업로드: IP당 분당 6건(처음 6건까지 바로 통과, 7번째부터 429)
    location = /api/sessions {
        limit_req zone=create burst=5 nodelay;
        limit_req zone=api burst=20 nodelay;
        include /etc/nginx/conf.d/proxy.inc;
    }
    location = /api/sessions/preview {
        limit_req zone=preview burst=5 nodelay;
        limit_req zone=api burst=20 nodelay;
        include /etc/nginx/conf.d/proxy.inc;
    }
    location ~ ^/api/(datasets|sessions|jobs|eval/runs)(/|$) {
        limit_req zone=api burst=20 nodelay;
        include /etc/nginx/conf.d/proxy.inc;
    }
    location ~ ^/api/(sample\.csv|template\.xlsx|bom/template)$ {
        limit_req zone=api burst=20 nodelay;
        include /etc/nginx/conf.d/proxy.inc;
    }

    # ---- 정적 파일(프런트 빌드) + SPA 새로고침 ----
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }
    location = /index.html {
        expires -1;
    }
    location / {
        try_files $uri /index.html;
    }
}
