# D1 운영 스택: 개발용 docker-compose.yml 과 별도 파일·별도 프로젝트 이름·별도 볼륨(개발 DB 볼륨 lci_pgdata 를 건드리지 않는다)
# 실행: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d     (순서는 docs/LCA/deploy/D1-runbook.md)
# 호스트에 열리는 포트는 nginx 의 127.0.0.1:8080 하나뿐(점검용). 외부 공개는 터널(cloudflared)이 http://nginx:80 으로 직접 접속한다
name: lci-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lci}
      POSTGRES_USER: ${POSTGRES_USER:-lci}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env.prod 에 POSTGRES_PASSWORD 가 필요합니다}
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    command: >
      postgres
      -c shared_buffers=192MB
      -c work_mem=16MB
      -c maintenance_work_mem=96MB
      -c max_connections=30
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    mem_limit: 768m
    shm_size: 128mb
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:0.40.7
    restart: unless-stopped
    environment:
      # 모델을 메모리에 계속 둔다. 기본 5분이면 한가한 뒤 첫 요청이 모델을 다시 읽느라(이 PC에서 약 100초) 임베더 대기 시간을 넘긴다
      OLLAMA_KEEP_ALIVE: 24h
    volumes:
      - ollama_models:/root/.ollama
    networks: [internal]
    mem_limit: 2g
    logging: *logging
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  backend:
    build: ./Backend
    image: lci-prod-backend:local
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-lci}
      POSTGRES_USER: ${POSTGRES_USER:-lci}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env.prod 에 POSTGRES_PASSWORD 가 필요합니다}
      OLLAMA_HOST: http://ollama:11434
    volumes:
      # 성능 확인 화면의 평가 리포트(json). 이미지에는 넣지 않고 읽기 전용으로 읽는다
      - ./Backend/app/data/eval_reports:/app/Backend/app/data/eval_reports:ro
    networks: [internal]
    depends_on:
      db: {condition: service_healthy}
      ollama: {condition: service_healthy}
    mem_limit: 768m
    logging: *logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/datasets?limit=1', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 20s

  # 1회성 명령(마이그레이션·적재·인덱싱)용. 평소에는 켜지 않는다: docker compose ... run --rm tools python -m app.db.migrate
  # 국가 DB 원본(data/raw)은 이 서비스에만 읽기 전용으로 붙인다(재배포 금지라 이미지에 넣지 않는다)
  tools:
    image: lci-prod-backend:local
    profiles: ["tools"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-lci}
      POSTGRES_USER: ${POSTGRES_USER:-lci}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env.prod 에 POSTGRES_PASSWORD 가 필요합니다}
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ./data/raw:/app/data/raw:ro
      # 적재 도구가 data/raw/ingest-report.md 를 쓰기 때문에 이 파일 하나만 쓰기 가능한 별도 파일로 덮는다(런북에서 먼저 만든다)
      - ./data/raw/prod-ingest-report.md:/app/data/raw/ingest-report.md
    networks: [internal]
    depends_on:
      db: {condition: service_healthy}
      ollama: {condition: service_healthy}
    mem_limit: 768m
    logging: *logging

  nginx:
    build: ./Frontend
    image: lci-prod-nginx:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/proxy.inc:/etc/nginx/conf.d/proxy.inc:ro
    networks: [internal, edge]
    depends_on:
      backend: {condition: service_healthy}
    mem_limit: 64m
    logging: *logging
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 3s
      retries: 5

  # 터널은 사용자가 직접 켠다: docker compose -f docker-compose.prod.yml --env-file .env.prod --profile tunnel up -d cloudflared
  cloudflared:
    image: cloudflare/cloudflared:2026.10.2
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --metrics 127.0.0.1:2000 run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?.env.prod 에 CLOUDFLARE_TUNNEL_TOKEN 이 필요합니다}
    networks:
      edge:
        ipv4_address: 172.28.10.10
    depends_on:
      nginx: {condition: service_healthy}
    mem_limit: 128m
    logging: *logging
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  internal: {}
  # nginx 와 cloudflared 만 있는 망. nginx 는 이 망의 172.28.10.10(cloudflared)에게서 온 CF-Connecting-IP 만 믿는다
  edge:
    ipam:
      config:
        - subnet: 172.28.10.0/24

volumes:
  pgdata:
  ollama_models:
